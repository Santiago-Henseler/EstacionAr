services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    restart: always #unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: